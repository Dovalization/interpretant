# The Prefect deployments of interpretant's jobs (src/interpretant/orchestration), registered with
# `.venv/bin/prefect deploy --all`. Each job deploys once, on the runner (the machine with the GPU),
# from a commit published on GitHub; to run a job on this machine, run its command. Machine names,
# folders and worker commands are Prefect variables set outside this public repository
# (interpretant_runner_*), so nothing here names a host.
name: interpretant
prefect-version: 3.9.3

definitions:
  roles:
    runner: &runner
      tags: [interpretant]
      work_pool:
        name: "{{ prefect.variables.interpretant_runner_pool }}"
        # One run at a time in the runner's one checkout: two commits can't be checked out at once
        work_queue_name: interpretant
        job_variables:
          command: "{{ prefect.variables.interpretant_runner_command }}"
      pull:
        - prefect.deployments.steps.set_working_directory:
            directory: "{{ prefect.variables.interpretant_runner_dir }}"
        # Before the flow's code is imported: refuse a checkout with someone's work in it, check out
        # the submitted commit and install what its lock says. Prefect's git_clone isn't used: when
        # a fetch fails it deletes the folder and clones again, and this folder holds the data.
        - prefect.deployments.steps.run_shell_script:
            shell: true
            stream_output: true
            script: |
              test -z "$(git status --porcelain --untracked-files=no)" || { echo "the runner's checkout has changes to tracked files; commit or discard them there" >&2; exit 1; }
              git fetch --quiet origin
              git checkout --quiet --detach "${INTERPRETANT_COMMIT:-origin/main}"
              uv sync --quiet --locked --inexact --extra orchestration --extra gpu --extra labels

deployments:
  - name: runner
    description: Any command on the runner, from the submitted commit
    entrypoint: src/interpretant/orchestration/flows.py:run_command
    <<: *runner

  - name: runner
    description: "Write the staging tables of OpenAlex, Crossref and PubMed works from the raw files, on the runner, from the submitted commit"
    entrypoint: src/interpretant/orchestration/flows.py:build_linked_tables
    <<: *runner

  - name: runner
    description: "Count the word repairs and write the repaired texts the spaCy pass reads, on the runner, from the submitted commit"
    entrypoint: src/interpretant/orchestration/flows.py:count_word_repairs
    <<: *runner

  - name: runner
    description: "Annotate the selected cells with spaCy (stage 2), part by part, on the runner, from the submitted commit"
    entrypoint: src/interpretant/orchestration/flows.py:annotate_corpus
    <<: *runner

  - name: runner
    description: "Give each sentence its language with lingua, on the runner, from the submitted commit"
    entrypoint: src/interpretant/orchestration/flows.py:detect_languages
    <<: *runner

  - name: runner
    description: "Apply the cleaning rules to the annotated abstracts, on the runner, from the submitted commit"
    entrypoint: src/interpretant/orchestration/flows.py:clean_corpus
    <<: *runner

  - name: runner
    description: "Apply the corpus-level rules to every part and write the abstracts table (stage 3), on the runner, from the submitted commit"
    entrypoint: src/interpretant/orchestration/flows.py:build_corpus
    <<: *runner

  - name: runner
    description: "Write the corpus report and its metrics, read before the review (4b), on the runner, from the submitted commit"
    entrypoint: src/interpretant/orchestration/flows.py:report_corpus
    <<: *runner

  - name: runner
    description: "Write the static view: lemma exceptions, then the spelling and compound maps applied, on the runner, from the submitted commit"
    entrypoint: src/interpretant/orchestration/flows.py:build_static_view
    <<: *runner

  - name: runner
    description: "Write the sentence view, with the sentence cuts repaired, on the runner, from the submitted commit"
    entrypoint: src/interpretant/orchestration/flows.py:build_sentence_view
    <<: *runner

  - name: runner
    description: "Find the targets' mentions and write their usages, on the GPU (decision agenda 4.1-4.6), on the runner, from the submitted commit"
    entrypoint: src/interpretant/orchestration/flows.py:build_usages
    <<: *runner

  - name: runner
    description: "Encode every record behind a drawn usage with the frozen text encoder, on the GPU, on the runner, from the submitted commit"
    entrypoint: src/interpretant/orchestration/flows.py:embed_records
    <<: *runner

  - name: runner
    description: "Score every record behind a drawn usage with the junk gate's two decision models on the runner's Ollama, on the runner, from the submitted commit"
    entrypoint: src/interpretant/orchestration/flows.py:score_records
    <<: *runner

  - name: runner
    description: "Score every record behind a drawn usage for junk and screen the cells, on the runner, from the submitted commit"
    entrypoint: src/interpretant/orchestration/flows.py:build_junk_gate
    <<: *runner

  - name: runner
    description: "Fetch OpenAlex's record of every raw work, resuming where it stopped, on the runner, from the submitted commit"
    entrypoint: src/interpretant/orchestration/flows.py:fetch_metadata
    <<: *runner

  - name: runner
    description: "Look each raw work up in Crossref and PubMed, resuming where it stopped, on the runner, from the submitted commit"
    entrypoint: src/interpretant/orchestration/flows.py:fetch_linked_sources
    <<: *runner

  - name: runner
    description: "Draw the matching audit's kept, left-out and missed usages as review items, on the runner, from the submitted commit"
    entrypoint: src/interpretant/orchestration/flows.py:draw_usages_audit
    <<: *runner

  - name: runner
    description: "Draw one of the junk gate's sets of records as review items, on the runner, from the submitted commit"
    entrypoint: src/interpretant/orchestration/flows.py:draw_junk_gate
    <<: *runner

  - name: runner
    description: "Judge review items through the Message Batches API, on the runner, from the submitted commit"
    entrypoint: src/interpretant/orchestration/flows.py:judge_api
    <<: *runner

  - name: runner
    description: "Judge review items with Claude Code on the subscription, on the runner, from the submitted commit"
    entrypoint: src/interpretant/orchestration/flows.py:judge_claude_code
    <<: *runner

  - name: runner
    description: "Judge review items with a local model on an Ollama server, on the runner, from the submitted commit"
    entrypoint: src/interpretant/orchestration/flows.py:judge_ollama
    <<: *runner

