# The Prefect deployments of interpretant's jobs (src/interpretant/orchestration), registered with
# `.venv/bin/prefect deploy --all`. Each job deploys twice: on the runner, the machine with the GPU,
# from a submitted commit; and locally, in the working checkout as it is. Machine names, folders and
# worker commands are Prefect variables set outside this public repository (interpretant_runner_*,
# interpretant_local_*), so nothing here names a host.
name: interpretant
prefect-version: 3.9.3

definitions:
  roles:
    runner: &runner
      tags: [interpretant]
      work_pool:
        name: "{{ prefect.variables.interpretant_runner_pool }}"
        # One run at a time in the runner's one checkout: two commits can't be checked out at once
        work_queue_name: interpretant
        job_variables:
          command: "{{ prefect.variables.interpretant_runner_command }}"
      pull:
        - prefect.deployments.steps.set_working_directory:
            directory: "{{ prefect.variables.interpretant_runner_dir }}"
        # Before the flow's code is imported: refuse a checkout with someone's work in it, then check
        # out the submitted commit and make sure the environment matches its lock. Each line runs
        # in its own shell.
        - prefect.deployments.steps.run_shell_script:
            shell: true
            stream_output: true
            script: |
              test -z "$(git status --porcelain --untracked-files=no)" || { echo "the runner's checkout has changes to tracked files; commit or discard them there" >&2; exit 1; }
              test -n "$(git for-each-ref --count=1 --contains HEAD)" || { echo "the runner's checkout is on a commit no branch holds; save it with git switch -c first" >&2; exit 1; }
              git fetch --quiet relay
              git checkout --quiet --detach "${INTERPRETANT_COMMIT:-relay/main}"
              uv sync --check --locked --inexact --extra orchestration --extra gpu --extra labels >/dev/null 2>&1 || { echo "the runner's environment doesn't match uv.lock; run there: uv sync --locked --extra orchestration --extra gpu --extra labels" >&2; exit 1; }
    local: &local
      tags: [interpretant]
      work_pool:
        name: "{{ prefect.variables.interpretant_local_pool }}"
        job_variables:
          command: "{{ prefect.variables.interpretant_local_command }}"
      pull:
        - prefect.deployments.steps.set_working_directory:
            directory: "{{ prefect.variables.interpretant_local_dir }}"
    # Procedures (orchestration/procedures.py) run on a machine that stays up, from a clone of the
    # relay with only Prefect installed, and wait for their steps' runs on the runner
    procedures: &procedures
      tags: [interpretant]
      work_pool:
        name: "{{ prefect.variables.interpretant_procedures_pool }}"
        job_variables:
          command: "{{ prefect.variables.interpretant_procedures_command }}"
      pull:
        - prefect.deployments.steps.set_working_directory:
            directory: "{{ prefect.variables.interpretant_procedures_dir }}"
        - prefect.deployments.steps.run_shell_script:
            shell: true
            stream_output: true
            script: |
              git fetch --quiet relay
              git checkout --quiet --detach "${INTERPRETANT_COMMIT:-relay/main}"

deployments:
  - name: procedures
    description: "The matching audit: draw, judge and adjudicate on the runner, wait for the author's amendment and scorer, then score"
    entrypoint: src/interpretant/orchestration/procedures.py:usages_audit
    <<: *procedures

  - name: runner
    description: Any command on the runner, from the submitted commit
    entrypoint: src/interpretant/orchestration/flows.py:run_command
    parameters: {role: runner}
    <<: *runner

  - name: local
    description: Any command in the local checkout as it is
    entrypoint: src/interpretant/orchestration/flows.py:run_command
    parameters: {role: local}
    <<: *local

  - name: runner
    description: "Write the staging tables of OpenAlex, Crossref and PubMed works from the raw files, on the runner, from the submitted commit"
    entrypoint: src/interpretant/orchestration/flows.py:build_linked_tables
    parameters: {role: runner}
    <<: *runner

  - name: local
    description: "Write the staging tables of OpenAlex, Crossref and PubMed works from the raw files, in the local checkout as it is"
    entrypoint: src/interpretant/orchestration/flows.py:build_linked_tables
    parameters: {role: local}
    <<: *local

  - name: runner
    description: "Count the word repairs and write the repaired texts the spaCy pass reads, on the runner, from the submitted commit"
    entrypoint: src/interpretant/orchestration/flows.py:count_word_repairs
    parameters: {role: runner}
    <<: *runner

  - name: local
    description: "Count the word repairs and write the repaired texts the spaCy pass reads, in the local checkout as it is"
    entrypoint: src/interpretant/orchestration/flows.py:count_word_repairs
    parameters: {role: local}
    <<: *local

  - name: runner
    description: "Annotate the selected cells with spaCy (stage 2), part by part, on the runner, from the submitted commit"
    entrypoint: src/interpretant/orchestration/flows.py:annotate_corpus
    parameters: {role: runner}
    <<: *runner

  - name: local
    description: "Annotate the selected cells with spaCy (stage 2), part by part, in the local checkout as it is"
    entrypoint: src/interpretant/orchestration/flows.py:annotate_corpus
    parameters: {role: local}
    <<: *local

  - name: runner
    description: "Give each sentence its language with lingua, on the runner, from the submitted commit"
    entrypoint: src/interpretant/orchestration/flows.py:detect_languages
    parameters: {role: runner}
    <<: *runner

  - name: local
    description: "Give each sentence its language with lingua, in the local checkout as it is"
    entrypoint: src/interpretant/orchestration/flows.py:detect_languages
    parameters: {role: local}
    <<: *local

  - name: runner
    description: "Apply the cleaning rules to the annotated abstracts, on the runner, from the submitted commit"
    entrypoint: src/interpretant/orchestration/flows.py:clean_corpus
    parameters: {role: runner}
    <<: *runner

  - name: local
    description: "Apply the cleaning rules to the annotated abstracts, in the local checkout as it is"
    entrypoint: src/interpretant/orchestration/flows.py:clean_corpus
    parameters: {role: local}
    <<: *local

  - name: runner
    description: "Apply the corpus-level rules to every part and write the abstracts table (stage 3), on the runner, from the submitted commit"
    entrypoint: src/interpretant/orchestration/flows.py:build_corpus
    parameters: {role: runner}
    <<: *runner

  - name: local
    description: "Apply the corpus-level rules to every part and write the abstracts table (stage 3), in the local checkout as it is"
    entrypoint: src/interpretant/orchestration/flows.py:build_corpus
    parameters: {role: local}
    <<: *local

  - name: runner
    description: "Write the corpus report and its metrics, read before the review (4b), on the runner, from the submitted commit"
    entrypoint: src/interpretant/orchestration/flows.py:report_corpus
    parameters: {role: runner}
    <<: *runner

  - name: local
    description: "Write the corpus report and its metrics, read before the review (4b), in the local checkout as it is"
    entrypoint: src/interpretant/orchestration/flows.py:report_corpus
    parameters: {role: local}
    <<: *local

  - name: runner
    description: "Write the static view: lemma exceptions, then the spelling and compound maps applied, on the runner, from the submitted commit"
    entrypoint: src/interpretant/orchestration/flows.py:build_static_view
    parameters: {role: runner}
    <<: *runner

  - name: local
    description: "Write the static view: lemma exceptions, then the spelling and compound maps applied, in the local checkout as it is"
    entrypoint: src/interpretant/orchestration/flows.py:build_static_view
    parameters: {role: local}
    <<: *local

  - name: runner
    description: "Write the sentence view, with the sentence cuts repaired, on the runner, from the submitted commit"
    entrypoint: src/interpretant/orchestration/flows.py:build_sentence_view
    parameters: {role: runner}
    <<: *runner

  - name: local
    description: "Write the sentence view, with the sentence cuts repaired, in the local checkout as it is"
    entrypoint: src/interpretant/orchestration/flows.py:build_sentence_view
    parameters: {role: local}
    <<: *local

  - name: runner
    description: "Find the targets' mentions and write their usages, on the GPU (decision agenda 4.1-4.6), on the runner, from the submitted commit"
    entrypoint: src/interpretant/orchestration/flows.py:build_usages
    parameters: {role: runner}
    <<: *runner

  - name: local
    description: "Find the targets' mentions and write their usages, on the GPU (decision agenda 4.1-4.6), in the local checkout as it is"
    entrypoint: src/interpretant/orchestration/flows.py:build_usages
    parameters: {role: local}
    <<: *local

  - name: runner
    description: "Fetch OpenAlex's record of every raw work, resuming where it stopped, on the runner, from the submitted commit"
    entrypoint: src/interpretant/orchestration/flows.py:fetch_metadata
    parameters: {role: runner}
    <<: *runner

  - name: local
    description: "Fetch OpenAlex's record of every raw work, resuming where it stopped, in the local checkout as it is"
    entrypoint: src/interpretant/orchestration/flows.py:fetch_metadata
    parameters: {role: local}
    <<: *local

  - name: runner
    description: "Look each raw work up in Crossref and PubMed, resuming where it stopped, on the runner, from the submitted commit"
    entrypoint: src/interpretant/orchestration/flows.py:fetch_linked_sources
    parameters: {role: runner}
    <<: *runner

  - name: local
    description: "Look each raw work up in Crossref and PubMed, resuming where it stopped, in the local checkout as it is"
    entrypoint: src/interpretant/orchestration/flows.py:fetch_linked_sources
    parameters: {role: local}
    <<: *local

  - name: runner
    description: "Draw the matching audit's kept, left-out and missed usages as review items, on the runner, from the submitted commit"
    entrypoint: src/interpretant/orchestration/flows.py:draw_usages_audit
    parameters: {role: runner}
    <<: *runner

  - name: local
    description: "Draw the matching audit's kept, left-out and missed usages as review items, in the local checkout as it is"
    entrypoint: src/interpretant/orchestration/flows.py:draw_usages_audit
    parameters: {role: local}
    <<: *local

  - name: runner
    description: "Judge review items through the Message Batches API, on the runner, from the submitted commit"
    entrypoint: src/interpretant/orchestration/flows.py:judge_api
    parameters: {role: runner}
    <<: *runner

  - name: local
    description: "Judge review items through the Message Batches API, in the local checkout as it is"
    entrypoint: src/interpretant/orchestration/flows.py:judge_api
    parameters: {role: local}
    <<: *local

  - name: runner
    description: "Judge review items with Claude Code on the subscription, on the runner, from the submitted commit"
    entrypoint: src/interpretant/orchestration/flows.py:judge_claude_code
    parameters: {role: runner}
    <<: *runner

  - name: local
    description: "Judge review items with Claude Code on the subscription, in the local checkout as it is"
    entrypoint: src/interpretant/orchestration/flows.py:judge_claude_code
    parameters: {role: local}
    <<: *local
