# Every dataset the pipelines read or write: its location and storage format, written once here.
# Read by interpretant.catalog (decision agenda, step 8.3); dvc.yaml reads it through `vars:`.
# Paths are relative to this file.

# The regular OpenAlex samples, one gzipped JSON Lines file per cell: <field>/<decade>.jsonl.gz.
raw_abstracts:
  path: data/raw/openalex
  format: jsonl.gz

# OpenAlex's record of each raw work beyond its abstract (source, indexes, topics, authorships,
# references and more), fetched by id: one gzipped JSON Lines file per raw cell, same layout.
work_metadata:
  path: data/raw/openalex_metadata
  format: jsonl.gz

# Each raw work's record in Crossref (by DOI) and PubMed (by PubMed id), fetched once: one
# gzipped JSON Lines file per raw cell, same layout (decision agenda 4.8, linked sources).
crossref_records:
  path: data/raw/crossref
  format: jsonl.gz

pubmed_records:
  path: data/raw/pubmed
  format: jsonl.gz

# The staging tables (decision agenda 4.8, layers): one checked table per source, keyed by work
# id, rebuilt from the raw files above by the build_linked_tables stage.
openalex_works:
  path: data/interim/openalex_works.parquet
  format: parquet

crossref_works:
  path: data/interim/crossref_works.parquet
  format: parquet

pubmed_works:
  path: data/interim/pubmed_works.parquet
  format: parquet

# The abstracts table as the spaCy pass leaves it (stage 2), one part per field and decade; the
# corpus-level rules (stage 3) read it and write the abstracts table below.
annotated_abstracts:
  path: data/interim/annotated_abstracts
  format: parquet

abstracts:
  path: data/processed/abstracts
  format: parquet

# What each rule dropped, removed and flagged, by decade and field (decision agenda 4b).
corpus_report:
  path: data/processed/corpus_report.md
  format: markdown

# What changed since an earlier build: outcomes, removals and sentence languages, with samples
# (interpretant compare-corpus, run by hand after each build).
corpus_comparison:
  path: data/processed/corpus_comparison.md
  format: markdown

# The corpus report's counts as JSON, kept in git so DVC compares them between commits.
corpus_metrics:
  path: metrics/corpus.json
  format: json

# One line per run of a corpus command: when, from which commit, how long each stage took.
run_log:
  path: metrics/runs.jsonl
  format: jsonl

cleaning_rules:
  path: curated/cleaning_rules.yaml
  format: yaml

cleaning_patterns:
  path: curated/cleaning_patterns.jsonl
  format: jsonl

# DOIs OpenAlex gives wrongly, with the evidence for each; applied wherever a DOI is read.
doi_corrections:
  path: curated/doi_corrections.yaml
  format: yaml

# The kinds of record that are not a work's own abstract, what shows each, and what is done.
record_types:
  path: curated/record_types.yaml
  format: yaml

# Glued words kept joined although the corpus counts would split them, each with its evidence.
kept_joined_words:
  path: curated/kept_joined_words.yaml
  format: yaml

# Broken-word pairs kept apart although the corpus counts would join them, each with its
# evidence.
kept_apart_words:
  path: curated/kept_apart_words.yaml
  format: yaml

# Every glued word of the repaired texts (a lower-case letter run into a capital), its counts
# over the corpus and whether the spaCy pass splits it (decision agenda 2.3, run 7).
glued_words:
  path: data/interim/glued_words.parquet
  format: parquet

# Every word of the texts after the glued-word splits that is broken by a space or a line-end
# hyphen, its counts over the corpus and whether the spaCy pass joins it (decision agenda 2.3,
# run 7c).
split_words:
  path: data/interim/split_words.parquet
  format: parquet

# Every candidate lower-case glued word of the texts after the split-word joins, its counts over
# the corpus and whether it is split before the spaCy pass (decision agenda 2.3, run 8).
lower_glued_words:
  path: data/interim/lower_glued_words.parquet
  format: parquet

# Each work's text after repair, the glued-word splits and the split-word joins, one part per
# field and decade, written by count-word-repairs and read by the spaCy pass.
repaired_texts:
  path: data/interim/repaired_texts
  format: parquet

annotations:
  path: data/interim/annotations
  format: docbin

# Each cached document's sentences as the spaCy pass split them (work id, start, end), in the
# cache's order, one part per field and decade: the language stage reads these with the repaired
# texts instead of the DocBins.
sentences:
  path: data/interim/sentences
  format: parquet

# The static view's tokens of every cached document (thin version: no phrases or word tables),
# each with its character offset and finite-verb flag, one part per field and decade: a build's
# removed ranges apply to the offsets, so cleaning changes never rebuild it.
static_view:
  path: data/interim/static_view
  format: parquet

# The forms whose static-view lemma differs from spaCy's in-context lemma, each under one reading
# (NNS or VBZ), from the lemma review (docs/lemma_review.md), applied to the cached documents.
lemma_exceptions:
  path: curated/lemma_exceptions.tsv
  format: tsv

# The words the project studies (decision agenda 4.7): lemma, the parts of speech in scope, match
# by lemma or form, held out for the confirming run.
words:
  path: curated/words.tsv
  format: tsv

# The spelling map (decision agenda 3.4; docs/spellings.md): each British or American variant and
# the standard it is written as, the form the corpus uses more often; audited before use.
spellings:
  path: curated/spellings.tsv
  format: tsv

# The compound map (decision agenda 3.4; docs/compounds.md): each spelling of a two-part compound
# and the form it is written as, the family's most frequent; audited before use.
compounds:
  path: curated/compounds.tsv
  format: tsv

# lingua's language for every sentence of the annotation cache, one part per field and decade.
sentence_languages:
  path: data/interim/sentence_languages
  format: parquet
