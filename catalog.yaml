# Every dataset the pipelines read or write: its location and storage format, written once here.
# Read by interpretant.catalog (decision agenda, step 8.3); dvc.yaml will read it through `vars:`.
# Paths are relative to this file.

# The regular OpenAlex samples, one gzipped JSON Lines file per cell: <field>/<decade>.jsonl.gz.
raw_abstracts:
  path: data/raw/openalex
  format: jsonl.gz

# OpenAlex's record of each raw work beyond its abstract (source, indexes, topics, authorships,
# references and more), fetched by id: one gzipped JSON Lines file per raw cell, same layout.
work_metadata:
  path: data/raw/openalex_metadata
  format: jsonl.gz

# The abstracts table as the spaCy pass leaves it (stage 2), one part per field and decade; the
# corpus-level rules (stage 3) read it and write the abstracts table below.
annotated_abstracts:
  path: data/interim/annotated_abstracts
  format: parquet

abstracts:
  path: data/processed/abstracts
  format: parquet

cleaning_rules:
  path: curated/cleaning_rules.yaml
  format: yaml

cleaning_patterns:
  path: curated/cleaning_patterns.jsonl
  format: jsonl

annotations:
  path: data/interim/annotations
  format: docbin
