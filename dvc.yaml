# The corpus pipeline (decision agenda, step 9): `uv run dvc repro` runs the stages whose data,
# code, curated files or settings changed since `dvc.lock` was written, and `dvc.lock` records
# what each output was made from. Paths come from catalog.yaml, written there once.
#
# Each stage lists the exact modules its pipeline imports and its own command module, which builds
# its settings (tests/test_dvc_stages.py checks both, and the params sections), so a change reruns
# only what it can affect. Stage 2 is split three ways so the costly spaCy models
# rerun only for tokenizer, sentence-rule or model changes: a language setting reruns from
# detect_languages, a cleaning pattern or threshold from clean_corpus. A catalog change that
# cannot affect outputs (a dataset added for a later step) is recorded with `dvc commit <stage>`
# instead of a rerun. Library versions (uv.lock) are not dependencies: after an
# upgrade that can change results, rerun with `dvc repro --force`.
#
# The downloads are not stages: they are registered with `dvc add` (data/raw/*.dvc), the lookups
# in Crossref and PubMed included, since what they hold depends on the day they were fetched.

vars:
  - catalog.yaml

stages:
  # One checked table per source, keyed by work id, from the raw files (decision agenda 4.8,
  # layers); the DOI corrections are applied here. The cleaning stage reads these.
  build_linked_tables:
    cmd: interpretant build-linked-tables
    deps:
      - src/interpretant/catalog/config.py
      - src/interpretant/catalog/curated.py
      - src/interpretant/catalog/json_lines.py
      - src/interpretant/catalog/linked_records.py
      - src/interpretant/catalog/metadata.py
      - src/interpretant/catalog/raw.py
      - src/interpretant/catalog/schemas.py
      - src/interpretant/catalog/staging.py
      - src/interpretant/cli/build_linked_tables.py
      - src/interpretant/corpus/bibliographic.py
      - src/interpretant/corpus/cleaning.py
      - src/interpretant/corpus/crossref.py
      - src/interpretant/corpus/pubmed.py
      - src/interpretant/corpus/work_metadata.py
      - src/interpretant/pipelines/build_linked_tables.py
      - src/interpretant/pipelines/progress.py
      - ${work_metadata.path}
      - ${crossref_records.path}
      - ${pubmed_records.path}
      - ${doi_corrections.path}
    outs:
      - ${openalex_works.path}
      - ${crossref_works.path}
      - ${pubmed_works.path}

  # Run 7 of the cleaning runs (decision agenda 2.3): the glued words of the repaired texts,
  # counted over the corpus, and which of them the spaCy pass splits. A few minutes; its table is
  # reviewed before the pass reads it.
  count_word_repairs:
    cmd: interpretant count-word-repairs
    deps:
      - src/interpretant/catalog/config.py
      - src/interpretant/catalog/curated.py
      - src/interpretant/catalog/glued_words.py
      - src/interpretant/catalog/json_lines.py
      - src/interpretant/catalog/lower_glued_words.py
      - src/interpretant/catalog/metadata.py
      - src/interpretant/catalog/parts.py
      - src/interpretant/catalog/raw.py
      - src/interpretant/catalog/repaired_texts.py
      - src/interpretant/catalog/split_words.py
      - src/interpretant/cli/count_word_repairs.py
      - src/interpretant/corpus/dictionary.py
      - src/interpretant/corpus/glued_words.py
      - src/interpretant/corpus/lower_glued_words.py
      - src/interpretant/corpus/phrase_counts.py
      - src/interpretant/corpus/repair.py
      - src/interpretant/corpus/split_words.py
      - src/interpretant/corpus/works.py
      - src/interpretant/pipelines/corpus.py
      - src/interpretant/pipelines/count_word_repairs.py
      - src/interpretant/pipelines/params.py
      - src/interpretant/pipelines/progress.py
      - src/interpretant/pipelines/workers.py
      - ${kept_apart_words.path}
      - ${kept_joined_words.path}
      - ${raw_abstracts.path}
      - ${work_metadata.path}
    params:
      - corpus
      - count_word_repairs
    outs:
      - ${glued_words.path}
      - ${split_words.path}
      - ${lower_glued_words.path}
      # The texts with every repair made, read by the spaCy pass: about as large as the corpus,
      # remade in under three minutes, so kept on the machine that ran the stage, never in the
      # DVC store.
      - ${repaired_texts.path}:
          cache: false

  annotate_corpus:
    cmd: interpretant annotate-corpus
    deps:
      - src/interpretant/catalog/annotations.py
      - src/interpretant/catalog/config.py
      - src/interpretant/catalog/json_lines.py
      - src/interpretant/catalog/metadata.py
      - src/interpretant/catalog/parts.py
      - src/interpretant/catalog/raw.py
      - src/interpretant/catalog/repaired_texts.py
      - src/interpretant/catalog/sentences.py
      - src/interpretant/cli/annotate_corpus.py
      - src/interpretant/corpus/annotation.py
      - src/interpretant/corpus/attribute_rules.py
      - src/interpretant/corpus/repair.py
      - src/interpretant/corpus/works.py
      - src/interpretant/pipelines/annotate_corpus.py
      - src/interpretant/pipelines/corpus.py
      - src/interpretant/pipelines/params.py
      - src/interpretant/pipelines/progress.py
      - src/interpretant/pipelines/workers.py
      - ${repaired_texts.path}
    params:
      - corpus
      - annotate_corpus
    outs:
      # Kept on the machine that ran the pass (about 1 GB), never in the DVC store. It persists,
      # so a pass stopped part-way can be finished by hand part by part (`--field`, `--decade`)
      # and recorded with `dvc commit annotate_corpus`.
      - ${annotations.path}:
          cache: false
          persist: true
      # Each document's sentence ranges, which the language stage reads instead of the DocBins;
      # kept beside the cache, as it is.
      - ${sentences.path}:
          cache: false
          persist: true

  detect_languages:
    cmd: interpretant detect-languages
    deps:
      - src/interpretant/catalog/config.py
      - src/interpretant/catalog/json_lines.py
      - src/interpretant/catalog/languages.py
      - src/interpretant/catalog/metadata.py
      - src/interpretant/catalog/parts.py
      - src/interpretant/catalog/raw.py
      - src/interpretant/catalog/repaired_texts.py
      - src/interpretant/catalog/sentences.py
      - src/interpretant/cli/detect_languages.py
      - src/interpretant/corpus/language.py
      - src/interpretant/corpus/works.py
      - src/interpretant/pipelines/corpus.py
      - src/interpretant/pipelines/detect_languages.py
      - src/interpretant/pipelines/params.py
      - src/interpretant/pipelines/progress.py
      - src/interpretant/pipelines/workers.py
      - ${repaired_texts.path}
      - ${sentences.path}
    params:
      - corpus
      - detect_languages
    outs:
      - ${sentence_languages.path}

  build_static_view:
    cmd: interpretant build-static-view
    deps:
      - src/interpretant/catalog/annotations.py
      - src/interpretant/catalog/compounds.py
      - src/interpretant/catalog/config.py
      - src/interpretant/catalog/json_lines.py
      - src/interpretant/catalog/lemma_exceptions.py
      - src/interpretant/catalog/metadata.py
      - src/interpretant/catalog/parts.py
      - src/interpretant/catalog/raw.py
      - src/interpretant/catalog/spellings.py
      - src/interpretant/catalog/static_view.py
      - src/interpretant/cli/build_static_view.py
      - src/interpretant/corpus/attribute_rules.py
      - src/interpretant/corpus/compound_spelling.py
      - src/interpretant/corpus/lemma_exceptions.py
      - src/interpretant/corpus/spelling.py
      - src/interpretant/corpus/static_view.py
      - src/interpretant/corpus/works.py
      - src/interpretant/pipelines/build_static_view.py
      - src/interpretant/pipelines/corpus.py
      - src/interpretant/pipelines/params.py
      - src/interpretant/pipelines/progress.py
      - src/interpretant/pipelines/workers.py
      - ${annotations.path}
      - ${lemma_exceptions.path}
      - ${spellings.path}
      - ${compounds.path}
    params:
      - corpus
    outs:
      - ${static_view.path}

  build_sentence_view:
    cmd: interpretant build-sentence-view
    deps:
      - src/interpretant/catalog/abstracts.py
      - src/interpretant/catalog/config.py
      - src/interpretant/catalog/parts.py
      - src/interpretant/catalog/schemas.py
      - src/interpretant/catalog/sentence_view.py
      - src/interpretant/cli/build_sentence_view.py
      - src/interpretant/corpus/cleaning.py
      - src/interpretant/corpus/sentence_view.py
      - src/interpretant/pipelines/build_sentence_view.py
      - src/interpretant/pipelines/progress.py
      - src/interpretant/pipelines/workers.py
      - ${abstracts.path}
    outs:
      - ${sentence_view.path}

  build_usages:
    cmd: interpretant build-usages
    deps:
      - src/interpretant/catalog/abstracts.py
      - src/interpretant/catalog/annotation_cache.py
      - src/interpretant/catalog/annotations.py
      - src/interpretant/catalog/config.py
      - src/interpretant/catalog/json_lines.py
      - src/interpretant/catalog/lemma_exceptions.py
      - src/interpretant/catalog/metadata.py
      - src/interpretant/catalog/parts.py
      - src/interpretant/catalog/raw.py
      - src/interpretant/catalog/schemas.py
      - src/interpretant/catalog/sentence_view.py
      - src/interpretant/catalog/spellings.py
      - src/interpretant/catalog/static_view.py
      - src/interpretant/catalog/usages.py
      - src/interpretant/catalog/words.py
      - src/interpretant/cli/build_usages.py
      - src/interpretant/corpus/attribute_rules.py
      - src/interpretant/corpus/cleaning.py
      - src/interpretant/corpus/compound_spelling.py
      - src/interpretant/corpus/lemma_exceptions.py
      - src/interpretant/corpus/sentence_view.py
      - src/interpretant/corpus/spelling.py
      - src/interpretant/corpus/static_view.py
      - src/interpretant/corpus/works.py
      - src/interpretant/pipelines/build_usages.py
      - src/interpretant/pipelines/corpus.py
      - src/interpretant/pipelines/params.py
      - src/interpretant/pipelines/progress.py
      - src/interpretant/pipelines/workers.py
      - src/interpretant/usages/checks.py
      - src/interpretant/usages/entities.py
      - src/interpretant/usages/identifiers.py
      - src/interpretant/usages/target_matching.py
      - src/interpretant/usages/traits.py
      - src/interpretant/usages/usage_selection.py
      - ${abstracts.path}
      - ${annotations.path}
      - ${sentence_view.path}
      - ${static_view.path}
      - ${lemma_exceptions.path}
      - ${spellings.path}
      - ${words.path}
      - ${held_out_words.path}
    params:
      - build_usages
      - corpus
    outs:
      - ${usages.path}

  clean_corpus:
    cmd: interpretant clean-corpus
    deps:
      - src/interpretant/catalog/abstracts.py
      - src/interpretant/catalog/annotations.py
      - src/interpretant/catalog/config.py
      - src/interpretant/catalog/curated.py
      - src/interpretant/catalog/json_lines.py
      - src/interpretant/catalog/languages.py
      - src/interpretant/catalog/metadata.py
      - src/interpretant/catalog/parts.py
      - src/interpretant/catalog/raw.py
      - src/interpretant/catalog/schemas.py
      - src/interpretant/cli/clean_corpus.py
      - src/interpretant/corpus/language.py
      - src/interpretant/corpus/removals.py
      - src/interpretant/corpus/repair.py
      - src/interpretant/corpus/works.py
      - src/interpretant/pipelines/clean_corpus.py
      - src/interpretant/pipelines/corpus.py
      - src/interpretant/pipelines/params.py
      - src/interpretant/pipelines/progress.py
      - src/interpretant/pipelines/workers.py
      - ${cleaning_rules.path}
      - ${cleaning_patterns.path}
      - ${raw_abstracts.path}
      - ${work_metadata.path}
      - ${annotations.path}
      - ${sentence_languages.path}
    params:
      - corpus
      - clean_corpus
    outs:
      - ${annotated_abstracts.path}

  build_corpus:
    cmd: interpretant build-corpus
    deps:
      - src/interpretant/catalog/abstracts.py
      - src/interpretant/catalog/config.py
      - src/interpretant/catalog/curated.py
      - src/interpretant/catalog/json_lines.py
      - src/interpretant/catalog/metadata.py
      - src/interpretant/catalog/parts.py
      - src/interpretant/catalog/raw.py
      - src/interpretant/catalog/schemas.py
      - src/interpretant/catalog/staging.py
      - src/interpretant/cli/build_corpus.py
      - src/interpretant/corpus/bibliographic.py
      - src/interpretant/corpus/cleaning.py
      - src/interpretant/corpus/deduplication.py
      - src/interpretant/corpus/language.py
      - src/interpretant/corpus/record_types.py
      - src/interpretant/corpus/removals.py
      - src/interpretant/corpus/repair.py
      - src/interpretant/corpus/work_metadata.py
      - src/interpretant/corpus/works.py
      - src/interpretant/pipelines/build_corpus.py
      - src/interpretant/pipelines/corpus.py
      - src/interpretant/pipelines/params.py
      - src/interpretant/pipelines/progress.py
      - src/interpretant/pipelines/workers.py
      - ${record_types.path}
      - ${annotated_abstracts.path}
      - ${raw_abstracts.path}
      - ${openalex_works.path}
      - ${crossref_works.path}
      - ${pubmed_works.path}
    params:
      - corpus
      - build_corpus
    outs:
      - ${abstracts.path}

  report_corpus:
    cmd: interpretant report-corpus
    deps:
      - src/interpretant/catalog/abstracts.py
      - src/interpretant/catalog/config.py
      - src/interpretant/catalog/curated.py
      - src/interpretant/catalog/json_lines.py
      - src/interpretant/catalog/metadata.py
      - src/interpretant/catalog/parts.py
      - src/interpretant/catalog/raw.py
      - src/interpretant/catalog/reports.py
      - src/interpretant/catalog/schemas.py
      - src/interpretant/catalog/staging.py
      - src/interpretant/cli/report_corpus.py
      - src/interpretant/corpus/bibliographic.py
      - src/interpretant/corpus/cleaning.py
      - src/interpretant/corpus/work_metadata.py
      - src/interpretant/pipelines/progress.py
      - src/interpretant/pipelines/report_corpus.py
      - src/interpretant/review/corpus_report.py
      - ${abstracts.path}
      - ${openalex_works.path}
    outs:
      - ${corpus_report.path}
    metrics:
      # Kept in git, so `dvc metrics diff` compares the corpus between commits. It persists, so
      # the report can compare the run with the metrics it replaces.
      - ${corpus_metrics.path}:
          cache: false
          persist: true
