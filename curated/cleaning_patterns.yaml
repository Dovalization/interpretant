# What the spaCy pass removes from abstracts, and why (decision agenda, step 2.3).
# Translated from the pre-rebuild regex rules on 2026-11-13; AWAITING THE AUTHOR'S REVIEW (phase 1b),
# after which runs never write here. Each pattern is a spaCy SpanRuler token pattern;
# every match becomes a labelled removal span, so every removal carries its reason.

# Mis-decoding signatures, read on the raw text: an abstract showing one is dropped.
mojibake_signatures:
  - 'Ã[\x80-\xbf]'
  - 'â€'
  - 'Â[\xa0-\xbf]'

# What each label removes:
#   tokens:   the matched tokens, skipped in the static view (contextual sentences keep them, so
#             target offsets do not move);
#   sentence: the sentence holding the match, dropped from both views;
#   abstract: the whole abstract, dropped with the label as its reason.
labels:
  url: tokens
  email: tokens
  doi: tokens
  latex: tokens
  abstract_label: tokens
  footer: sentence
  copyright: sentence
  catalogue_record: abstract
  citation_record: abstract
  web_scrape: abstract
  exam_spam: abstract

# at_start: the pattern counts only when it begins the abstract.
patterns:
  # Links and identifiers.
  - {label: url, pattern: [{LIKE_URL: true}]}
  - {label: email, pattern: [{LIKE_EMAIL: true}]}
  - label: doi
    pattern: [{TEXT: {REGEX: '^(?:doi:|https?://(?:dx\.)?doi\.org/)?10\.\d{4,9}/\S+$'}}]
  # LaTeX: a token with a command or a superscript or subscript marker.
  - {label: latex, pattern: [{TEXT: {REGEX: '\\[A-Za-z]+|[\^_]\{'}}]}
  # The leading "Abstract" or "Summary" label, with its punctuation.
  - label: abstract_label
    at_start: true
    pattern: [{LOWER: {IN: [abstract, summary]}}, {IS_PUNCT: true, OP: '*'}]

  # Footers appended to real abstracts: JSTOR's download stamp, purchase prompts.
  - {label: footer, pattern: [{LOWER: this}, {LOWER: content}, {LOWER: downloaded}, {LOWER: from}]}
  - {label: footer, pattern: [{LOWER: all}, {LOWER: use}, {LOWER: subject}, {LOWER: to}]}
  - {label: footer, pattern: [{LOWER: click}, {LOWER: here}]}
  # Copyright lines: the formula, the sign, or "copyright" or "(c)" before a year.
  - {label: copyright, pattern: [{LOWER: all}, {LOWER: rights}, {LOWER: reserved}]}
  - {label: copyright, pattern: [{TEXT: '©'}]}
  - {label: copyright, pattern: [{LOWER: copyright}, {SHAPE: dddd}]}
  - {label: copyright, pattern: [{TEXT: '('}, {LOWER: c}, {TEXT: ')'}, {SHAPE: dddd}]}

  # Records standing in for an abstract.
  - label: catalogue_record
    at_start: true
    pattern:
      - {LOWER: {IN: [letter, script, telegram, memo, memorandum, postcard, note]}}
      - {LOWER: {IN: [from, to, by]}}
  - label: citation_record
    pattern:
      - {LOWER: volume}
      - {LIKE_NUM: true}
      - {TEXT: ',', OP: '?'}
      - {LOWER: {IN: [issue, number]}}
      - {LIKE_NUM: true}
  # Publisher pages scraped in place of an abstract. A lone "Twitter" or "Facebook" is left
  # alone: social media are a research topic.
  - label: web_scrape
    at_start: true
    pattern: [{LOWER: {IN: [noaccess, no-access]}}]
  - {label: web_scrape, at_start: true, pattern: [{LOWER: 'no'}, {LOWER: access}]}
  - {label: web_scrape, pattern: [{LOWER: export}, {LOWER: citation}]}
  - {label: web_scrape, pattern: [{LOWER: save}, {LOWER: to}, {LOWER: binder}]}
  - {label: web_scrape, pattern: [{LOWER: add}, {LOWER: to}, {LOWER: favorites}]}
  - {label: web_scrape, pattern: [{LOWER: track}, {LOWER: citations}]}
  - {label: web_scrape, pattern: [{LOWER: {IN: [e-alerts, ealerts]}}]}
  - {label: web_scrape, pattern: [{LOWER: clicking}, {LOWER: 'on'}, {LOWER: the}, {LOWER: donut}]}
  - label: web_scrape
    pattern:
      - {LOWER: facebook}
      - {IS_PUNCT: true, OP: '*'}
      - {LOWER: twitter}
      - {IS_PUNCT: true, OP: '*'}
      - {LOWER: {IN: [linkedin, reddit, email, e-mail]}}
  - {label: web_scrape, pattern: [{LOWER: download}, {LOWER: citation}, {LOWER: file}]}
  - {label: web_scrape, pattern: [{LOWER: {IN: [easybib, refworks]}}]}
  - {label: web_scrape, pattern: [{LOWER: request}, {LOWER: reuse}, {LOWER: permissions}]}
  - {label: web_scrape, pattern: [{LOWER: {REGEX: 'rft_id'}}]}
  - {label: web_scrape, pattern: [{TEXT: {REGEX: '(%2[0-9a-fA-F]){3}'}}]}
  # Exam-dump advertising.
  - {label: exam_spam, pattern: [{LOWER: {REGEX: '^(brain-?dumps?|dumps4\w*|pass4sure)$'}}]}
  - {label: exam_spam, pattern: [{LOWER: brain}, {LOWER: {IN: [dump, dumps]}}]}
  - {label: exam_spam, pattern: [{LOWER: exam}, {LOWER: {IN: [dump, dumps]}}]}
  - {label: exam_spam, pattern: [{LOWER: dumps}, {LOWER: {IN: [pdf, questions]}}]}
  - {label: exam_spam, pattern: [{LOWER: certification}, {LOWER: {IN: [exam, exams]}}]}
  - label: exam_spam
    pattern: [{LOWER: exam}, {LOWER: questions}, {LOWER: and}, {LOWER: answers}]
  - {label: exam_spam, pattern: [{LOWER: actual}, {LOWER: exam, OP: '?'}, {LOWER: questions}]}
