# What the spaCy pass removes from abstracts, and why (decision agenda, step 2.3).
# Translated from the pre-rebuild regex rules on 2026-11-13 and approved provisionally by the
# author the same day: the sample audit checks each rule on its dropped abstracts (4b), and runs
# never write here. The token patterns themselves are in
# cleaning_patterns.jsonl, in spaCy's pattern-file format (one {"label", "pattern", "id"} object
# per line, read with srsly and added to the SpanRuler, as spaCy's documentation shows); every
# match becomes a labelled removal span, so every removal carries its reason.

# Mis-decoding signatures, read on the raw text: an abstract showing one is dropped.
mojibake_signatures:
  - 'Ã[\x80-\xbf]'
  - 'â€'
  - 'Â[\xa0-\xbf]'

# What each label removes:
#   tokens:   the matched tokens, skipped in the static view (contextual sentences keep them, so
#             target offsets do not move);
#   rest_of_sentence: from the match to the end of its sentence, dropped from both views (text
#             before a notice survives; until 2026-11-13 the whole sentence went, and run 1
#             lost the text glued before 1,885 copyright notices and 280 JSTOR stamps);
#   abstract: the whole abstract, dropped with the label as its reason;
#   abstract_or_sentence: as abstract when fewer than 30 words come before the match (the line
#             stands for the abstract), otherwise the sentences the match is in, from the first
#             one's start (a reference after real prose).
# A pattern with "id": "start" counts only when it begins the abstract or follows its leading
# "Abstract" label ("Abstract: To the Editor…"); other matches of it are set aside before
# overlapping matches are filtered, so they cannot hide a match that does count (run 6d).
labels:
  # Links and identifiers (spaCy's like_url and like_email; DOIs kept whole by the tokenizer).
  # A url match also needs a scheme, "www." or a slash, or a last dotted part from spaCy's list
  # of domain endings (spacy.lang.lex_attrs._tlds, 274 endings, copied from spaCy 3.8.18 into
  # the second url pattern; a test checks the copy). like_url alone also took glued words,
  # software and species names ("of.the", "Node.js", "E.coli"): 10,185 of run 1's 24,638 url
  # removals, spared since 2026-11-13.
  url: tokens
  email: tokens
  doi: tokens
  # A token with a LaTeX command or a superscript or subscript marker.
  latex: tokens
  # The leading "Abstract" or "Summary" label, with its punctuation (start only).
  abstract_label: tokens
  # Footers appended to real abstracts: purchase and login prompts, the start of the page
  # metadata of ASHA's publishing platform ("Additional Resources FiguresReferences..."), and
  # the start or end of a JSTOR download stamp whose other half is missing. Added 2026-11-16 (run
  # 12): ERIC's "Documents acquired by ERIC…", "Contains fulltext", the notice "These keywords
  # were added by machine…", and a Frontiers citation line ("Citation: …" opening the record, or
  # "Citation: … Frontiers in …"); 163 kept works in the build of record 2e20238, no lost prose
  # in 30 sampled removals (calibrated agent judges).
  footer: rest_of_sentence
  # Frontiers' conference-abstract header, "Event Abstract Back to Event", removed exactly: the
  # sentence splitter runs it, the title, the authors and their affiliations into the abstract's
  # first sentence, so removing to the end of the sentence took that sentence too (13 of 30
  # sampled). Added 2026-11-16 (run 12): 193 kept works, no lost prose in 30 sampled removals.
  event_header: tokens
  # JSTOR's download stamp, which sits at page breaks mid-text: "This content downloaded from
  # <address> on <date> <time> UTC All use subject to <terms>", removed exactly.
  download_stamp: tokens
  # Copyright notices: the formula, the sign, "copyright" or "(c)" before a year, "Copyright ©"
  # (also glued to the word before it) and APA's "(PsycINFO Database Record".
  copyright: rest_of_sentence
  # Letters, memos and similar catalogue records standing in for an abstract (start only).
  catalogue_record: abstract
  # A letter to the editor: a text opening with a salutation, after an "Abstract" label if any
  # ("To the Editor.— The recent article by…", "(To the Editor of 'The Daily News'.)", "SIR,-A
  # scientific shrine…", "Dear Editor, with great interest…"; start only). "Sir" needs
  # punctuation after it, also glued to the next word ("Sir .—I was amused"), so "Sir Isaac"
  # is not one. A salutation glued to a capitalised word counts after "To the" or "Dear" ("To
  # the EditorWe", "Dear SirMultinational"), a bare "Sir" glued to one does not ("SirJohn
  # Herschel"). The record kinds find letters by their metadata (curated/record_types.yaml);
  # the reason is the same. Moved here from the record kinds on 2026-11-15 (run 6c).
  letter: abstract
  # A citation string standing in for an abstract ("Volume 3, Issue 2"), or a record that
  # starts with its year in brackets and a full stop, "(1985). Title. Journal: Vol. 5, No. 2,
  # pp. 143-196." (start only; added 2026-11-13: 4,292 such records were kept in run 2, none over
  # 60 words, and 899 more were dropped as not_english only because lingua read the journal
  # line as Latin or French).
  citation_record: abstract
  # JSTOR's and OUP's citation lines, which citation_record misses: "…, Vol. 15, No. 1 (Feb.,
  # 1950), pp. 79-88" and "…, Volume X, Issue 1, January 1955, Pages 125–126" (a Roman volume,
  # or a numbered one with an issue that is not a number, so citation_record keeps the lines it
  # already drops). Added 2026-11-16
  # (run 9): in the build of record 2e20238, 1,660 and 1,068 kept works were such a line with
  # fewer than 30 words before it and 198 and 17 had one after real prose; none of run 3's 167
  # judged abstracts holds one, and agent judges calibrated on run 3's verdicts found no real
  # abstract and no lost prose in 30 sampled works of each.
  citation_line: abstract_or_sentence
  # A library catalogue's thesis notes at the start of the record, "Thesis (M.A.)--Georgetown
  # University, 2009.;", with an "Includes bibliographical references" or "Advisor:" note that
  # follows them (start only). Removed rather than dropped: what is left is kept if it is an
  # abstract and falls to too_short if nothing is. Added 2026-11-16 (run 9): of 339 kept works
  # opening with such notes in the build of record 2e20238, 296 had fewer than 10 words left;
  # dropping all of them would have dropped real abstracts (2 of 30 sampled), removing the notes
  # lost no prose in 30 sampled works (calibrated agent judges).
  thesis_notes: rest_of_sentence
  # Publisher pages scraped in place of an abstract. A lone "Twitter" or "Facebook" is left
  # alone: social media are a research topic. "No Access" glued to the journal name
  # ("No AccessJournal of Speech...") was added on 2026-11-13: 547 ASHA pages, title, authors,
  # page tools and citing works with no abstract, were kept in run 1. Added 2026-11-16 (run 10):
  # the ACM Digital Library's page ("Authors Info & Claims", "Get Citation Alerts", "Citation
  # Alert added", "Publication History 2010", "2Downloads", "Total Citations12"; 1,917 kept works
  # in the build of record 2e20238), "Preview this article" and a capitalised "Get access" not
  # followed by "to" (2,102; "get access to" opens real sentences: all 9 drops of the first
  # version that matched a publisher abstract were "patients will get access to the program").
  # Calibrated agent judges found no real abstract in 30 sampled drops of each.
  web_scrape: abstract
  # A library link with an OpenURL key (rft_id) or percent-encoding: the whole link, the run of
  # tokens with no space between them around the encoded token. Until 2026-11-13 these patterns
  # were web_scrape and dropped the abstract: 32 of run 1's drops were real evidence summaries
  # ending in a list of such links.
  encoded_link: tokens
  # Exam-dump advertising, matched only by words naming dumps or dump sites. Phrases such as
  # "certification exam" and "actual questions" were dropped on 2026-11-13: they removed real
  # abstracts (a study of English certification exams, an NGF paper's "actual questions").
  exam_spam: abstract
