line-length = 100
target-version = "py311"
# Kept as a record of how the decision agenda's numbers were measured, not maintained code.
extend-exclude = ["scripts/evidence"]

[lint]
select = ["E", "F", "W", "I", "UP", "ANN", "N", "B", "C4", "SIM"]
ignore = ["ANN101", "ANN102", "ANN401"]

[lint.per-file-ignores]
"tests/*" = ["ANN"]

[format]
quote-style = "double"
indent-style = "space"
