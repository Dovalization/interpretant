line-length = 100
target-version = "py311"
# Kept as a record of how the decision agenda's numbers were measured, not maintained code.
extend-exclude = ["scripts/evidence"]

[lint]
# The rules behind docs/code_standards.md; each ignore below says why.
select = [
    "E", "W",  # pycodestyle
    "F",       # pyflakes
    "I",       # import order
    "B",       # bugbear
    "C4",      # comprehensions
    "UP",      # modern syntax
    "A",       # shadowing builtins
    "PTH",     # pathlib over os.path
    "SIM",     # simplifications, guard clauses
    "RET",     # returns, early exits
    "RUF",     # ruff's own (stale noqa, mutable defaults)
    "PERF",    # performance anti-patterns
    "PIE",     # unnecessary code
    "FLY",     # static string joins
    "PGH",     # blanket type: ignore
    "FA",      # future annotations
    "N",       # naming case
    "TRY",     # error handling
    "FBT",     # boolean arguments are keyword-only
    "ERA",     # commented-out code
    "T20",     # no print in library code
    "NPY",     # numpy
    "D",       # docstrings (Google convention)
    "ANN",     # annotations
]
ignore = [
    "SIM108",  # forced ternaries often read worse than if/else
    "RET504",  # a named value before return helps reading and debugging
    "TRY003",  # long messages in exceptions are fine; no class per message
    "TRY300",  # moving statements to else often hurts reading
    "RUF001",  # deliberate typography in strings (→, ×, ′)
    "RUF002",  # the same in docstrings
    "RUF003",  # the same in comments
    "D105",    # magic methods need no docstring
    "D107",    # __init__ is documented on its class
]

[lint.pydocstyle]
convention = "google"

[lint.per-file-ignores]
# Tests: names describe the behaviour, so no docstrings or annotations are required.
"tests/*" = ["ANN", "D"]

# Legacy: modules written before docs/code_standards.md, exempt only from the rules they break
