[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "interpretant"
version = "0.1.0"
description = "Diachronic semantic drift tracker for academic corpora"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "interpretant contributors" }]

dependencies = [
    "click>=8.1",
    "rich>=13.0",
    "tqdm>=4.65",
    "hydra-core>=1.3",
    "omegaconf>=2.3",
    "gensim>=4.3",
    "numpy>=1.26",
    "scipy>=1.11",
    "pandas>=2.1",
    "plotly>=5.18",
    "streamlit>=1.30",
    "pydantic>=2.5",
    "pydantic-settings>=2.1",
    "scikit-learn>=1.4",
    "bibtexparser>=1.4.4",
    "docling>=2.0",
    "pymupdf>=1.24",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "mypy>=1.7",
    "ruff>=0.1",
]
docs = [
    "mkdocs>=1.5",
    "mkdocs-material>=9.4",
]

[project.scripts]
interpretant = "interpretant.__main__:cli"

[tool.hatch.build.targets.wheel]
packages = ["src/interpretant"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"

[tool.mypy]
python_version = "3.11"
strict = true
mypy_path = "src"
namespace_packages = true
explicit_package_bases = true
