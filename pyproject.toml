[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "interpretant"
version = "0.1.0"
description = "How academic fields change what they do with a word: per-field, per-decade embeddings tested against pre-registered predictions"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "interpretant contributors" }]

dependencies = [
    "click>=8.1",
    "rich>=13.0",
    "tqdm>=4.65",
    "gensim>=4.3",
    "numpy>=1.26",
    "scipy>=1.11",
    "pandas>=2.1",
    "plotly>=5.18",
    "streamlit>=1.30",
    "pydantic-settings>=2.1",
    "scikit-learn>=1.4",
    "docling>=2.0",
    "pymupdf>=1.24",
    "matplotlib>=3.10.8",
    "simplemma>=2.0",
    "torch>=2.4",
    "transformers>=4.48",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "mypy>=1.7",
    "ruff>=0.1",
    "pandas-stubs>=3.1.0.261029",
]
labels = [
    "anthropic>=2.8.0",
    "nltk>=3.10.4",
    "typesafe-sdk>=0.7.5",
]

[project.scripts]
interpretant = "interpretant.__main__:cli"

[tool.hatch.build.targets.wheel]
packages = ["src/interpretant"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"

[tool.mypy]
python_version = "3.11"
strict = true
mypy_path = "src"
namespace_packages = true
explicit_package_bases = true

[[tool.mypy.overrides]]
module = ["gensim.*", "scipy.*", "sklearn.*", "streamlit.*", "plotly.*", "tqdm.*"]
ignore_missing_imports = true
