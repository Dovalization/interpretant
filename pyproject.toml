[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "interpretant"
version = "0.1.0"
description = "How academic fields change what they do with a word: per-field, per-decade embeddings tested against pre-registered predictions"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "interpretant contributors" }]

dependencies = [
    "click>=8.1",
    "rich>=13.0",
    "tqdm>=4.65",
    "gensim>=4.3",
    "numpy>=1.26",
    "scipy>=1.11",
    "pydantic-settings>=2.1",
    "scikit-learn>=1.4",
    "matplotlib>=3.10.8",
    "simplemma>=2.0",
    "torch>=2.4",
    "transformers>=4.48",
    "sentencepiece>=0.2",
    "protobuf>=7.36.1",
    "spacy>=3.8",
    "lingua-language-detector>=2.0",
    "datasketch>=1.6",
    "polars>=1.0",
    "pandera[polars]>=0.20",
    "en-core-web-sm",
    "en-core-web-trf",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "mypy>=1.7",
    "ruff>=0.1",
]
labels = [
    "anthropic>=2.8.0",
    "typesafe-sdk>=0.7.5",
]
# CuPy for spaCy on a CUDA 12 GPU (the homelab). Linux only, so `uv sync --all-extras` still works
# on the Mac. Required directly, not through spacy[cuda12x], whose resolution picks a CuPy that
# forces NumPy 1.
gpu = [
    "cupy-cuda12x>=13.3; sys_platform == 'linux'",
]

[project.scripts]
interpretant = "interpretant.__main__:cli"

[tool.hatch.build.targets.wheel]
packages = ["src/interpretant"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"

[tool.mypy]
python_version = "3.11"
strict = true
mypy_path = "src"
namespace_packages = true
explicit_package_bases = true

[[tool.mypy.overrides]]
module = ["gensim.*", "scipy.*", "sklearn.*", "tqdm.*", "networkx.*"]
ignore_missing_imports = true

[tool.uv.sources]
en-core-web-sm = { url = "https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl" }
en-core-web-trf = { url = "https://github.com/explosion/spacy-models/releases/download/en_core_web_trf-3.8.0/en_core_web_trf-3.8.0-py3-none-any.whl" }
