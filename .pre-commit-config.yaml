# The automatic layers of docs/code_standards.md, run before every commit. CI runs the same.
# Install once with: uv run pre-commit install
repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: uv run ruff check --force-exclude
        language: system
        types: [python]
      - id: ruff-format
        name: ruff format
        entry: uv run ruff format --check --force-exclude
        language: system
        types: [python]
      - id: mypy
        name: mypy (strict)
        entry: uv run mypy src
        language: system
        types: [python]
        pass_filenames: false
      - id: vulture
        name: vulture (dead code)
        entry: uv run vulture src tests --min-confidence 80
        language: system
        types: [python]
        pass_filenames: false
      - id: pytest
        name: pytest (including the naming rules)
        entry: uv run pytest -q
        language: system
        types: [python]
        pass_filenames: false
