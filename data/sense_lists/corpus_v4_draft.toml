# DRAFT version 4 of the corpus sense lists, for development only, not frozen: version 2 with
# prompt's fixes (faulty adjective cues removed, interface and dialogue prompts seeded as cues
# to a person, modal verb cues, and the PROMPT ontology tool out of scope), plus cues mined from pre-2020
# computing contexts for prompt's cue-to-a-person and adjective senses.
# Added 2026-11-12 (the author's decision): network's actor-network sense, with social
# networks excluding its cues.
# Cue words: lowercase whole words that signal the sense within five words of the target;
# "<word" counts only before the target, ">word" only after it; "<<word" and ">>word" only
# as the word right next to it. "!word" is an exclusion: when it appears within five words,
# that sense's cues do not count.
# A word's "out_of_scope" words put a usage outside the list when one appears within five
# words of the target.

[attention]
word = "attention"

[[attention.senses]]
key = "cognitive_attention"
definition = "A person's or animal's mental focus on something, as studied in psychology and neuroscience, including attention drawn or captured by a stimulus in studies of perception and behaviour"
example = "Sleep loss impairs sustained attention in older adults."
cues = ["<<divided", "deficit", "deficits", "adhd", "vigilance", "distraction", "executive", ">>bias", ">>biases", "<<orienting", "<<visual", "<<selective", "<<spatial", "<<sustained", "<<voluntary", "<<auditory", "<<joint", "<<covert", "<<visuospatial", "<<attentional", "capture", ">captured"]

[[attention.senses]]
key = "notice_or_consideration"
definition = "Notice, interest or consideration that people, groups or institutions give to a topic, problem or thing, including authors directing it, as in we focus our attention on; attention captured by a stimulus belongs to cognitive attention"
example = "The issue has received growing attention from policymakers."
cues = ["<received", "<receive", "<receiving", "drawn", "<draw", "drew", "attracted", "attract", "attracting", "paid", "pay", "paying", "<<increasing", "growing", "<<considerable", "little", "special", "deserves", "public", "<<media", "scholarly", "widespread", ">given", "<focus", "<focuses", "<focusing", "<direct", "<directs", "<directed", "<directing", "<turn", "<turns", "<turned", "<turning", "<confine", "<restrict", "<restricting", "<devote", "<devoted", "<devotes", "<<our", "<<my", "!gaze", "!eye", "!eyes", "!visual", "!driver", "!stimulus", "!stimuli", "!cues", "!cue"]

[[attention.senses]]
key = "attention_mechanism"
