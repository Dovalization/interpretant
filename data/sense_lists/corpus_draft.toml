# Draft sense lists and cue words for rung 2 on this corpus (docs/plan_sense_labels.md), written by
# Claude on 2026-11-10 for the author's approval. Not frozen until approved. Three choices come
# from the labeller pilot, which showed check 2b's usages: platform's delivery_channel sense,
# having's obligation sense, and the boundary between component's first and third senses.
# Cue words: lowercase whole words that signal the sense within five words of the target;
# "<word" counts only before the target, ">word" only after it; "<<word" and ">>word" only
# as the word right next to it.

[attention]
word = "attention"

[[attention.senses]]
key = "cognitive_attention"
definition = "A person's or animal's mental focus on something, as studied in psychology and neuroscience"
example = "Sleep loss impairs sustained attention in older adults."
cues = ["<<divided", "deficit", "deficits", "adhd", "vigilance", "distraction", "executive", ">>bias", ">>biases", "<<orienting"]

[[attention.senses]]
key = "notice_or_consideration"
definition = "Notice, interest or consideration that people, groups or institutions give to a topic, problem or thing, including authors directing it, as in we focus our attention on"
example = "The issue has received growing attention from policymakers."
cues = ["<received", "<receive", "<receiving", "drawn", "<draw", "drew", "attracted", "attract", "attracting", "paid", "pay", "paying", "<<increasing", "growing", "<<considerable", "little", "special", "deserves", "public", "<<media", "scholarly", "widespread", ">given"]

[[attention.senses]]
key = "attention_mechanism"
definition = "Attention in computing: a system selecting or weighting parts of its input, from early computational models, saliency maps and robots' focus of attention to the attention mechanism of neural networks, as in self-attention and transformers"
example = "A multi-head attention layer is added on top of the encoder."
cues = ["<<self", "<<head", ">>heads", ">>mechanism", ">>mechanisms", ">>layer", ">>layers", "transformer", "transformers", ">>module", ">>modules", "encoder", "decoder", "lstm", "convolutional", "embedding", "embeddings", "softmax", "scaled", "<<graph", "robot", "robots", "robotic", "foveation"]

