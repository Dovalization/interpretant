# Draft sense lists and cue words for rung 3's control words (data/control_words_rung3.txt),
# written by Claude on 2026-11-10 for the author's approval. Not frozen until approved.
# Cue words: lowercase whole words that signal the sense within five words of the target;
# "<word" counts only before the target, ">word" only after it; "<<word" and ">>word" only
# as the word right next to it.

[control]
word = "control"

[[control.senses]]
key = "technical_regulation"
definition = "Regulating or steering a machine, process or system, as in control theory, robot control or traffic control"
example = "The controller keeps the temperature stable through feedback control."
cues = [">>system", ">>systems", ">>theory", "<<feedback", ">>loop", "<<optimal", "<<adaptive", "<<process", "<<traffic", "<<motion", ">>law", ">>signal", "<<robot", "<<flight"]

[[control.senses]]
key = "comparison_condition"
definition = "A comparison group or condition in an experiment or study, against which a treatment is judged, or a variable held constant by design or statistical adjustment"
example = "Patients improved more than the control group."
cues = [">>group", ">>groups", ">>condition", ">>conditions", "<<healthy", "<<matched", ">>participants", ">>subjects", "<<placebo", ">>sample", ">>arm", "<statistical", "<statistically", "covariates", "covariate"]

[[control.senses]]
key = "power_or_authority"
definition = "Power, authority or restraint over people, organisations, territory or resources"
example = "The state tightened its control over the press."
cues = ["<<social", "<<political", "<<state", "<<government", "<<territorial", "<<parental", "<<gun", "<<crime"]

[[control.senses]]
key = "self_or_cognitive_control"
definition = "A person's regulation of their own thoughts, attention, emotions or behaviour, as in self-control or inhibitory control"
example = "Children with better inhibitory control resisted the distraction."
cues = ["<<self", "<<inhibitory", "<<cognitive", "<<executive", "<<attentional", "<<impulse", "<<emotional", "<<effortful", "<locus", "<<perceived"]

