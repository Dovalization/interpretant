# The pipelines' settings, one section per stage, read by each stage's pydantic settings object
# (decision agenda, step 9); DVC tracks them as parameters. Values marked provisional are fixed
# by the sample study and the sample audit.

# The raw cells the corpus is built from, read by both corpus stages.
corpus:
  fields: [ai, cogpsych, communication, compsci, hci, histphilsci, linguistics, neuroscience,
    philosophy, psychology, sociology]
  decades: [1950, 1960, 1970, 1980, 1990, 2000, 2010, 2020]

# The word repairs (count-word-repairs, decision agenda 2.3): which words the spaCy pass splits
# or joins after repair, decided from counts over the whole corpus.
count_word_repairs:
  # Run 7, the glued words: which words with a lower-case letter run into a capital are split.
  # All provisional, set from a sample.
  glued_words:
    # Split when the corpus writes the two parts apart at least this many times as often as
    # joined (10 on run 6d: 6,136 words, 9,632 uses; 3 would add 2,471 words, whose most
    # frequent are names and acronyms written joined: "DataGlove", "RealSense", "ToS", "InR").
    apart_margin: 10
    # Or when the second part is one of this many most common sentence openers ("The", "In",
    # "This"), the first part has at least this many letters and the second part at least this
    # many: a heading run into the text ("EditorsThis"), joined in every issue of a journal. A
    # second part of one letter is mostly a final "l" read as "I" ("proposaI") or a name
    # ("microA"), so it is never split off this way (608 words, 1,128 uses on run 6d).
    opener_count: 30
    opener_min_left_letters: 4
    opener_min_right_letters: 2
  # Run 7c, the split words: which words broken by a space or a line-end hyphen are joined, after
  # the glued-word splits. Both margins provisional, set from a sample.
  split_words:
    # A word is a candidate only when the corpus writes it whole at least this many times.
    min_word_count: 20
    # A break by a space, or by a hyphen and a space, is joined when the corpus writes the word
    # whole at least this many times as often as broken in any way (the survey: real breaks are
    # written whole hundreds of times as often, "infor-mation" 1,629, "sys tem" 2,228; real
    # hyphenated words far less, "co-operation" 8, "multi-modal" 6, "self-esteem" 0).
    join_margin: 10
    # A break by a hyphen alone, more often a real hyphenated word ("pre-schoolers" 23,
    # "trans-disciplinarity" 27), is joined only above this margin and when its second piece is
    # not a word spaCy knows.
    hyphen_margin: 100
  # Run 8, the lower-case glued words (decided 2026-11-15 after a survey of every word form the
  # lemma index does not know, samples read on the text that survives cleaning).
  lower_glued_words:
    # Split when the corpus writes the parts apart, with a space or a hyphen, at least this many
    # times as often as joined (margins of 3 to 10 were mostly real words or French: "login",
    # "frontend", "soit"; 9 of 40 right).
    apart_margin: 10
    # A part is a word spaCy knows that the corpus uses at least this many times.
    min_part_count: 20
    # The first of two parts has at least this many letters ("a" and a word is a guarded pattern).
    min_first_part_letters: 2
    # The guarded patterns ("a" and a word, three or more words, capitalised glue) apply only in
    # a text where at least this many two-word glues are split: outside such texts they mostly
    # hit real words, foreign words and names ("histotechnology", "aspecific", "Hasan").
    min_dense_splits: 2

# Stage 2a, the spaCy pass (annotate-corpus).
annotate_corpus:
  # Whether the pass runs spaCy's named entity recognition (ner, about 44% of a worker's time).
  # Off: matching recognises entities on target sentences only (4.1).
  named_entity_recognition: false

# Stage 2b, sentence languages (detect-languages).
detect_languages:
  # lingua's candidates: the languages with at least 0.5% of the sentences of abstracts not
  # confidently English, in a scan of 50,000 abstracts with all of lingua's 75 languages
  # (scripts/evidence/language_scan.py, 2026-11-13), less Latin. Against all 75 on those
  # sentences they read 0.4% of other-language sentences as English, where the old five
  # (en de es fr pt) read 10.3% (language_candidates.py). Latin was in run 2 and was taken out
  # after its audit: lingua read English prose and references as Latin (11 and 7 of 30 removed
  # "Latin" sentences, 3 real Latin), dropping about 2,150 real abstracts; real Latin is mostly
  # read as Italian or Spanish instead, still removed. The comparison's "3.7% leak without
  # Latin" had counted those English sentences as leaks, since the 75-language reference never
  # returns English where Latin wins.
  languages: [en, ar, bs, de, es, fi, fr, hr, id, it, ja, ko, ms, nl, pt, ru, tr, uk, zh]
  # lingua's confidence above which a whole abstract is read as English (provisional, 2.4).
  english_threshold: 0.9
  # lingua's minimum relative distance between a sentence's two likeliest languages; a closer
  # call is undetermined, so neither removed nor counted as another language (provisional, 2.4).
  minimum_relative_distance: 0.1

# Stage 2c, the cleaning patterns and keeping rules (clean-corpus).
clean_corpus:
  # An abstract is dropped as not English when fewer English words than this are left once
  # other-language text is removed, and that text had more words than are left (provisional,
  # 2.4). It replaced a share rule ("more than half another language") on 2026-11-13: the share
  # dropped the English summaries of abstracts printed in two or three languages, 1,636 of them
  # with 30 or more English words. The second condition, added after run 2, keeps short English
  # records with one misread fragment (1,724 in run 2).
  min_english_words: 30

# Stage 3, the corpus-level rules (build-corpus).
build_corpus:
  # A sentence shared by this many abstracts, digits masked, is a template (2.3).
  template_min_abstracts: 20
  # Jaccard similarity of word 5-shingles from which an abstract is a near-duplicate, computed
  # exactly for each candidate pair (provisional, 2.5).
  near_duplicate_threshold: 0.8
  # The similarity the MinHash LSH index is tuned for when it proposes candidate pairs. At 0.6 it
  # proposes a pair of similarity 0.8 98.6% of the time and one of 0.85 99.9%; tuned for 0.8 it
  # proposed them 40% and 69% of the time (datasketch's bands and rows for 128 permutations).
  near_duplicate_candidate_threshold: 0.6
  # No author holds more than this share of a cell's works, nor fewer than the floor (2.3).
  author_cap_share: 0.01
  author_cap_floor: 5

build_usages:
  # The seed of the draw keys: one usage per work and word is the eligible one with the smallest
  # key (agenda 4.2).
  seed: 20261301
  # The model annotating the usages; the transformer only if the model comparison decides (4.9).
  model: en_core_web_sm
  # The entity labels whose mentions are names, not uses of the word (4.1; all 11 name types,
  # the author, 2026-11-18). Dates, numbers, quantities and the like are not names.
  name_labels: [PERSON, NORP, FAC, ORG, GPE, LOC, PRODUCT, EVENT, WORK_OF_ART, LAW, LANGUAGE]
